components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        customer_type:
          $ref: '#/components/schemas/CustomerTypeEnum'
        phone_number:
          type: string
          maxLength: 20
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        address:
          type: string
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - created_at
      - customer_type
      - id
      - latitude
      - longitude
      - name
      - phone_number
    CustomerTypeEnum:
      enum:
      - KIOSK
      - SUPERMARKET
      - RESTAURANT
      - DISTRIBUTOR
      type: string
      description: |-
        * `KIOSK` - Kiosk
        * `SUPERMARKET` - Supermarket
        * `RESTAURANT` - Restaurant
        * `DISTRIBUTOR` - Distributor
    Delivery:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        route_stop:
          type: integer
        status:
          allOf:
          - $ref: '#/components/schemas/DeliveryStatusEnum'
          readOnly: true
        failure_reason:
          oneOf:
          - $ref: '#/components/schemas/FailureReasonEnum'
          - $ref: '#/components/schemas/BlankEnum'
        delivered_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        failed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        recipient_name:
          type: string
          maxLength: 150
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - delivered_at
      - failed_at
      - id
      - route_stop
      - status
      - updated_at
    DeliveryStatusEnum:
      enum:
      - PENDING
      - IN_PROGRESS
      - DELIVERED
      - FAILED
      type: string
      description: |-
        * `PENDING` - Pending
        * `IN_PROGRESS` - In Progress
        * `DELIVERED` - Delivered
        * `FAILED` - Failed
    DispatchResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    FailureReasonEnum:
      enum:
      - CUSTOMER_UNAVAILABLE
      - DAMAGED_GOODS
      - INCORRECT_ADDRESS
      - VEHICLE_BREAKDOWN
      - OTHER
      type: string
      description: |-
        * `CUSTOMER_UNAVAILABLE` - Customer Unavailable
        * `DAMAGED_GOODS` - Damaged Goods
        * `INCORRECT_ADDRESS` - Incorrect Address
        * `VEHICLE_BREAKDOWN` - Vehicle Breakdown
        * `OTHER` - Other
    Inventory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        warehouse:
          type: integer
        product:
          type: integer
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        reserved_quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        reorder_level:
          type: integer
          maximum: 2147483647
          minimum: 0
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - product
      - updated_at
      - warehouse
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
        status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          readOnly: true
        requested_delivery_date:
          type: string
          format: date
          nullable: true
        delivery_window_start:
          type: string
          format: time
          nullable: true
        delivery_window_end:
          type: string
          format: time
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        warehouse:
          type: integer
          readOnly: true
          nullable: true
        allocated_at:
